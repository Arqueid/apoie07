<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- ========================================== -->
  <!-- 1. Página de Compartilhamento              -->
  <!-- ========================================== -->
  
  <title>VideoPlayer</title>
  <link rel="stylesheet" href="estilo.css">
  
  <!-- Título em negrito no WhatsApp -->
  <meta property="og:title" content="As Crônicas de Nárnia">
  
  <!-- Aquele textinho menor que fica embaixo do título -->
  <meta property="og:description" content="Filme Postado No Site Para Uso Na Escola, sem o Auxilio do Pendrive apenas com conexão de Internet">
  
  <!-- A sua imagem do Imgur -->
  <meta property="og:image" content="https://files.catbox.moe/mzsv2s.webp">
  
  <!-- Opcional: define o tipo de conteúdo -->
  <meta property="og:type" content="website">

  <!-- ========================================== -->
  <!-- 2. O REDIRECIONAMENTO (Para os humanos)    -->
  <!-- ========================================== -->
  
  <!-- O HTML manda a pessoa para a página oficial na hora -->
  <meta http-equiv="refresh" content="0; url=https://arqueid.github.io/apoie07/player.html?v=vid_16">

  <!-- O JavaScript garante que a pessoa não fique presa ao clicar em "Voltar" -->
  <script>
    window.location.replace("https://arqueid.github.io/apoie07/player.html?v=vid_16");
  </script>
</head>
<body>
  <!-- Algo muito simples só pra não ficar uma tela em branco caso dê lag -->
  <p>Redirecting to the right place...</p>
</body>
</html>
